<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReciPic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='new_styles.css') }}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <style>
        *{
          overflow-x: hidden;
        }
        .recipe-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .recipe-card .card-img-top {
            object-fit: cover;
            height: 200px;
        }

        .recipe-card .card-title {
            font-size: 18px;
            margin-top: 10px;
            overflow-y: hidden;
        }

        .recipe-card .card-body {
            padding: 20px;
        }

        .recipe-card .btn-primary {
            background-color: #FF6F61;
            border-color: #FF6F61;
        }

        .recipe-card .btn-primary:hover {
            background-color: #FF4C3B;
            border-color: #FF4C3B;
        }

    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo"><p>ReciPic</p></div>
                <ul>
                    <div class="menu-button"><i class="fas fa-times close"></i></div>
                    <li><a href="{{ url_for('index') }}">Home</a></li>
                    <li><a href="{{ url_for('search') }}">Search</a></li>
                    <li><a href="{{ url_for('generate_recipe') }}">Generate Recipe</a></li>
                    <li><a href="{{ url_for('recipes') }}">Recipes</a></li>
                    <li><a href="#">Profile</a></li>
                </ul>
                <div class="menu-button"><i class="fas fa-bars menu"></i></div>
            </nav>
        </div>
    </header>
    <main>
        <div class="search">
            <p>Unlock Flavor with Words: Discover Your Next Culinary Masterpiece</p>
            <h2>Search for Recipes</h2>
            <input type="text" name="searchbar" id="searchbar" placeholder="Search for Recipes here "><br>
            <br><button class="primary-btn" onclick="searchRecipes()">Search</button>
        </div>
        <div class="recipe-container row justify-content-center">
            <!-- Recipe cards will be dynamically added here -->
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function searchRecipes() {
            const searchQuery = document.getElementById('searchbar').value;
            const apiUrl = `https://api.edamam.com/api/recipes/v2?type=public&q=${searchQuery}&app_id=118f431a&app_key=%2062a68ed6adf68b74cfd4963bd70ee2ca`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const recipes = data.hits;
                    const recipeContainer = document.querySelector('.recipe-container');
                    recipeContainer.innerHTML = ''; // Clear previous results

                    // Display the top 3 results in card format
                    for (let i = 0; i < Math.min(recipes.length, 3); i++) {
                        const recipe = recipes[i].recipe;
                        const card = document.createElement('div');
                        card.classList.add('recipe-card', 'col-md-4','mx-2', 'mb-4');
                        card.innerHTML = `
                            <div class="card">
                                <img src="${recipe.image}" class="card-img-top" alt="${recipe.label}">
                                <div class="card-body">
                                    <h5 class="card-title" style='color:black;'>${recipe.label}</h5>
                                    <button class="btn btn-primary" onclick="showFullRecipe('${recipe.url}')">View Recipe</button>
                                </div>
                            </div>
                        `;
                        recipeContainer.appendChild(card);
                    }
                })
                .catch(error => console.error(error));
        }

        function showFullRecipe(recipeUrl) {
            window.open(recipeUrl, '_blank');
        }
    </script>
</body>
</html>
